name: macOS package

# Builds ONE installer (EscapeEngine-<version>.pkg) that works on Apple Silicon and Intel Macs.
# - Release (no local git needed): Actions > "macOS package" > Run workflow on main, tick
#   "Publish a release". It tags v<version from pyproject.toml> and publishes the installer.
# - Test build only: Run workflow without ticking it (download from the run's Artifacts).
# - Pushing a tag like v0.2.0 also publishes a release.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a release (tags v<version> from pyproject.toml; main only)"
        type: boolean
        default: false
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "packaging/**"
      - "scripts/macos/**"
      - ".github/workflows/macos-package.yml"

permissions:
  contents: read

jobs:
  binary:
    name: Build (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
          - arch: x86_64
            runner: macos-15-intel  # last Intel runner GitHub offers (until Aug 2027)
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: scripts/macos/build_binary.sh
      - run: test -f "build/escape-macos-${{ matrix.arch }}.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.arch }}
          path: build/escape-macos-${{ matrix.arch }}.tar.gz
          retention-days: 3

  package:
    name: Installer
    needs: binary
    runs-on: macos-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: build
          merge-multiple: true
      - name: Read app version
        id: version
        run: echo "version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)" >> "$GITHUB_OUTPUT"
      - name: Tag must match the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          test "$GITHUB_REF_NAME" = "v${{ steps.version.outputs.version }}" \
            || { echo "tag $GITHUB_REF_NAME != v${{ steps.version.outputs.version }}"; exit 1; }
      - run: scripts/macos/build_pkg.sh
      - name: Install and smoke-test
        run: |
          sudo installer -pkg build/EscapeEngine-*.pkg -target /
          escape --version
          escape airports LON
          cfg="$HOME/Library/Application Support/escape-engine"
          mkdir -p "$cfg" && echo '{"setup_done": true, "auto_update_check": false}' > "$cfg/settings.json"
          printf '6\n' | escape menu
          escape setup --help > /dev/null
          escape update --help > /dev/null
          escape explore --help > /dev/null
          app="/Applications/Escape Engine.app"
          test -x "$app/Contents/MacOS/escape-engine"
          plutil -lint "$app/Contents/Info.plist"
          osacompile -o "$RUNNER_TEMP/launch.scpt" "$app/Contents/Resources/launch.applescript"
      - uses: actions/upload-artifact@v4
        with:
          name: EscapeEngine-macOS
          path: build/EscapeEngine-*.pkg

  release:
    name: Publish release
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: EscapeEngine-macOS
          path: dist
      - name: Create release (and its tag)
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            tag="v$VERSION"
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" > /dev/null 2>&1; then
              echo "::error::$tag already exists. Bump the version in pyproject.toml first."
              exit 1
            fi
          else
            tag="$GITHUB_REF_NAME"
          fi
          gh release create "$tag" dist/*.pkg \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Escape Engine $tag" \
            --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.package.outputs.version }}
